repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: bash -c 'cd backend && uv run ruff check --fix . && uv run ruff format .'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: bash -c 'cd backend && uv run mypy'
        language: system
        files: ^backend/app/.*\.py$
        pass_filenames: false
      - id: frontend-lint
        name: prettier + eslint
        entry: bash -c 'cd frontend && npx prettier --write src && npx eslint .'
        language: system
        files: ^frontend/src/
        pass_filenames: false
