[project]
name = "floorpulse"
version = "0.1.0"
description = "Shop-floor operations platform for small and mid-size manufacturers"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.2",
    "apscheduler>=3.10,<4",
    "prometheus-client>=0.20",
    "openpyxl>=3.1",
    "reportlab>=4.2",
    "qrcode>=7.4",
    "pillow>=10.4",
    "tzdata>=2026.4",
    "email-validator>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "hypothesis>=6.100",
    "types-qrcode",
    "types-openpyxl",
    "types-reportlab",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["alembic/versions"]  # generated

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"app/seed/*" = ["S311", "S105", "S106"]
"alembic/*" = ["E501"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[[tool.mypy.overrides]]
module = ["apscheduler.*", "sentry_sdk"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
